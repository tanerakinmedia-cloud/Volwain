name: Volwain Windows Kurulum Dosyasi
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri kur
        run: npm install
      - name: Windows kurulum dosyasini olustur
        run: npm run dist
      - name: Kurulum dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Volwain-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error
